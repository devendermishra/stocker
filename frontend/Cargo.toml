[package]
name = "stocker-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["web"]
# WASM + HTTP to stocker-api (mutually exclusive with `desktop`).
web = [
    "dioxus/web",
    "dep:gloo-net",
    "dep:gloo-timers",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "chrono/wasmbind",
]
# Native UI calling stocker_core / stocker_screener in-process (standalone app).
desktop = [
    "dioxus/desktop",
    "dep:stocker-core",
    "dep:stocker-screener",
    "dep:stocker-portfolio",
    "dep:tokio",
]

[dependencies]
dioxus = { version = "0.6", features = ["router"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

gloo-net = { version = "0.6", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Storage"] }
stocker-core = { path = "../crates/stocker-core", optional = true }
stocker-screener = { path = "../crates/stocker-screener", optional = true }
stocker-portfolio = { path = "../crates/stocker-portfolio", optional = true }
tokio = { version = "1", features = ["sync", "time"], optional = true }
