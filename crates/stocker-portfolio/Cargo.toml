[package]
name = "stocker-portfolio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stocker-core = { path = "../stocker-core" }
stocker-domain = { path = "../stocker-domain" }
stocker-screener = { path = "../stocker-screener" }
stocker-mf = { path = "../stocker-mf" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
thiserror = "2"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
csv = "1.3"
calamine = "0.26"
xlrd = "0.1"
umya-spreadsheet = "2.3"

[dev-dependencies]
tempfile = "3"
