[package]
name = "stocker-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stocker-cli"
path = "src/main.rs"

[dependencies]
stocker-core = { path = "../stocker-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
serde_json = "1.0"
