[package]
name = "stocker-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stocker-core = { path = "../stocker-core" }
stocker-portfolio = { path = "../stocker-portfolio" }
stocker-screener = { path = "../stocker-screener" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
oauth2 = { version = "4", features = ["reqwest"] }
webbrowser = "1"
tempfile = "3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
