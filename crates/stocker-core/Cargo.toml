[package]
name = "stocker-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.12", features = ["json", "gzip", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chrono = "0.4"
log = "0.4"
thiserror = "2"
urlencoding = "2"
