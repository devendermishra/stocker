[workspace]
resolver = "2"
members = [
    "crates/stocker-core",
    "crates/stocker-screener",
    "crates/stocker-mf",
    "crates/stocker-portfolio",
    "crates/api",
    "crates/cli",
    "frontend",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
